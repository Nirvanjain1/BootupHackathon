<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HandWave</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/airmouse.css"></head>
<body data-home="1"><main>
<h1 data-i18n="title">HandWave</h1>
<p data-i18n="tag"></p>
<div class="tools"><button id="camBtn" class="primary" data-i18n="cam"></button></div>
<div class="cards">
<a class="card" href="reader.html"><h2 data-i18n="reader"></h2><span data-i18n="readerD"></span></a>
<a class="card" href="games.html"><h2 data-i18n="games"></h2><span data-i18n="gamesD"></span></a>
</div></main>
<div id="cam"><video id="v" autoplay muted playsinline></video><canvas id="c"></canvas></div>
<script type="module" src="js/settings.js"></script>
<script type="module" src="js/gesture-engine.js"></script>
<script type="module" src="js/airmouse.js"></script>
<script type="module">Settings.init();
document.querySelector("#camBtn").onclick=async e=>{e.target.disabled=true;
 try{await GestureEngine.start(document.querySelector("#v"),document.querySelector("#c"))}catch(err){alert("Camera or model failed: "+err.message);e.target.disabled=false}};</script>
</body></html>
